<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Referee Tracker</title>
  <meta name="theme-color" content="#0A1F44" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./style.css?v=2026-08-31-g" />
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-logo">RT</div>
          <div class="brand-text">
            <h1>Referee<span>Tracker</span></h1>
          </div>
        </div>
        <div class="header-actions">
          <button id="rtProfileBtn" class="refresh-btn" type="button" aria-label="Mon profil" title="Mon profil">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </button>
          <button id="refreshBtn" class="refresh-btn" type="button" aria-label="Rafraîchir">
            <span aria-hidden="true">↻</span>
          </button>
          <button id="rtHeaderLogout" class="refresh-btn" type="button" aria-label="Se déconnecter" title="Se déconnecter">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="toolbar">
        <div class="field">
          <label for="seasonSelect">Saison</label>
          <select id="seasonSelect"></select>
        </div>
        <div class="field search-field">
          <label for="searchInput">Recherche</label>
          <input id="searchInput" type="search" placeholder="Club, salle, ville, collègue…" />
        </div>
      </section>

      <section id="statusBar" class="status-bar">Chargement…</section>

      <nav class="tabs" aria-label="Navigation principale">
        <button class="tab active" data-tab="matchs" type="button"><span>🏀</span>5×5</button>
        <button class="tab" data-tab="troisx3" type="button"><span>⚡</span>3×3</button>
        <button class="tab" data-tab="paiements" type="button"><span>💶</span>Paiements</button>
        <button class="tab" data-tab="stats" type="button"><span>📊</span>Stats</button>
        <button class="tab" data-tab="analyse" type="button"><span>📈</span>Analyse</button>
        <button class="tab" data-tab="alertes" type="button"><span>⚠️</span>Alertes</button>
        <button class="tab" data-tab="export" type="button"><span>📋</span>Export</button>
      </nav>

      <section id="matchs" class="panel active"></section>
      <section id="troisx3" class="panel"></section>
      <section id="paiements" class="panel"></section>
      <section id="stats" class="panel"></section>
      <section id="analyse" class="panel"></section>
      <section id="alertes" class="panel"></section>
      <section id="export" class="panel"></section>
    </main>

    <footer class="app-footer">
      <span>Referee Tracker</span> · données Google Sheets · carte © OpenStreetMap
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Génération du PDF de l'onglet Export -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="./rt-auth.js?v=2026-08-31"></script>
  <script src="./app.js?v=2026-08-31-h"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Referee Tracker</title>
  <meta name="theme-color" content="#0A1F44" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./style.css?v=2026-09-19j" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon-32.png?v=2026-09-15" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2026-09-15" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Referee Tracker" />
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-logo">RT</div>
          <div class="brand-text">
            <h1>Referee<span>Tracker</span></h1>
          </div>
        </div>
        <div class="header-actions">
          <button id="rtProfileBtn" class="refresh-btn" type="button" aria-label="Mon profil" title="Mon profil">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </button>
          <button id="refreshBtn" class="refresh-btn" type="button" aria-label="Rafraîchir">
            <span aria-hidden="true">↻</span>
          </button>
          <button id="rtHeaderLogout" class="refresh-btn" type="button" aria-label="Se déconnecter" title="Se déconnecter">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="toolbar">
        <div class="field">
          <label for="seasonSelect">Saison</label>
          <select id="seasonSelect"></select>
        </div>
        <div class="field search-field">
          <label for="searchInput">Recherche</label>
          <input id="searchInput" type="search" placeholder="Club, salle, ville, collègue…" />
        </div>
      </section>

      <section id="statusBar" class="status-bar">Chargement…</section>

      <nav class="tabs" aria-label="Navigation principale">
        <button class="tab active" data-tab="matchs" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M3 12h18"/><path d="M5.6 5.6c3 3 3 9.8 0 12.8"/><path d="M18.4 5.6c-3 3-3 9.8 0 12.8"/></svg></span><span class="tab-label">5×5</span></button>
        <button class="tab" data-tab="troisx3" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span><span class="tab-label">3×3</span></button>
        <button class="tab" data-tab="paiements" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 10v.01M18 14v.01"/></svg></span><span class="tab-label">Paiements</span></button>
        <button class="tab" data-tab="stats" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-6"/></svg></span><span class="tab-label">Stats</span></button>
        <button class="tab" data-tab="analyse" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg></span><span class="tab-label">Analyse</span></button>
        <button class="tab" data-tab="alertes" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 9v5"/><path d="M12 17h.01"/></svg></span><span class="tab-label">Alertes</span></button>
        <button class="tab" data-tab="export" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></span><span class="tab-label">Export</span></button>
        <button class="tab" data-tab="qcm" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 12l2 2 4-4"/></svg></span><span class="tab-label">QCM</span></button>
        <button class="tab" data-tab="progression" type="button"><span class="tab-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></span><span class="tab-label">Progression</span></button>
        <div class="tabs-foot"><span class="tabs-foot-dot"></span><span>Connecté</span></div>
      </nav>

      <section id="matchs" class="panel active"></section>
      <section id="troisx3" class="panel"></section>
      <section id="paiements" class="panel"></section>
      <section id="stats" class="panel">
        <div id="statsFinancier"></div>
      </section>
      <section id="analyse" class="panel">
        <div id="statsAnalyse"></div>
      </section>
      <section id="alertes" class="panel"></section>
      <section id="export" class="panel"></section>
      <section id="qcm" class="panel"></section>
      <section id="progression" class="panel"></section>
    </main>

    <footer class="app-footer">
      <span>Referee Tracker</span> · données Google Sheets · carte © OpenStreetMap
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Génération du PDF de l'onglet Export -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="./rt-auth.js?v=2026-09-07-b"></script>
  <script src="./app.js?v=2026-09-19o"></script>
</body>
</html>

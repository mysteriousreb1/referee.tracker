# Referee Tracker — contrôle anti-fuite à chaque envoi de fichiers.
# Si une info sensible est détectée : la coche passe au rouge et GitHub t'envoie un e-mail.
name: Scan infos sensibles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # analyse aussi l'historique
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
